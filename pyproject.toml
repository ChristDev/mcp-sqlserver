[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sqlserver"
version = "1.0.0"
description = "Token-efficient MCP server for SQL Server — 1 tool + resources + prompts"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "fastmcp>=2.14.0",
    "pyodbc>=5.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[project.scripts]
mcp-sqlserver = "mcp_sqlserver.main:main"

[tool.setuptools.packages.find]
include = ["mcp_sqlserver*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
