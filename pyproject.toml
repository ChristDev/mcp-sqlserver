[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sqlserver"
# Version lives in mcp_sqlserver/__init__.py so there is exactly one literal.
dynamic = ["version"]
description = "Token-efficient MCP server for SQL Server — 1 tool + resources + prompts"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
# fastmcp is pinned exactly, not to a range. A range let every image resolve a
# different patch at build time, so the same commit ran 3.4.0 in one container
# and 3.4.7 in another — and a defect reproducible in one was invisible in the
# other. Bump this deliberately, after testing, not as a side effect of a build.
dependencies = [
    "fastmcp==3.4.7",
    "pyodbc>=5.3.0,<6",
    "anyio>=4.13.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[project.scripts]
mcp-sqlserver = "mcp_sqlserver.main:main"

[tool.setuptools.dynamic]
version = {attr = "mcp_sqlserver.__version__"}

[tool.setuptools.packages.find]
include = ["mcp_sqlserver*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
