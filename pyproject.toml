[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sqlserver"
# Version lives in mcp_sqlserver/__init__.py so there is exactly one literal.
dynamic = ["version"]
description = "Token-efficient MCP server for SQL Server — 1 tool + resources + prompts"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
# Majors are pinned to what the concurrency work was validated against.
# fastmcp 3.x moved lifespan handling; do not float across a major.
dependencies = [
    "fastmcp>=3.2.0,<4",
    "pyodbc>=5.3.0,<6",
    "anyio>=4.13.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[project.scripts]
mcp-sqlserver = "mcp_sqlserver.main:main"

[tool.setuptools.dynamic]
version = {attr = "mcp_sqlserver.__version__"}

[tool.setuptools.packages.find]
include = ["mcp_sqlserver*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
